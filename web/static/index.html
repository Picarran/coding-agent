<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding Agent Workspace</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --hover: #21262d;
    --text: #e6edf3; --muted: #8b949e;
    --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
  /* ---- sidebar ---- */
  aside { width: 280px; min-width: 280px; background: #0d1117; border-right: 1px solid var(--border);
          display: flex; flex-direction: column; }
  .side-head { padding: 14px; border-bottom: 1px solid var(--border); }
  .side-head h1 { font-size: 15px; margin: 0 0 10px; color: var(--accent); }
  .side-head select { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--border);
                     border-radius: 6px; padding: 7px 8px; font-size: 13px; }
  .side-head .row { display: flex; gap: 6px; margin-top: 8px; }
  .side-head button { flex: 1; background: #238636; border: 1px solid #2ea043; color: #fff; border-radius: 6px;
                      padding: 7px; cursor: pointer; font-weight: 600; }
  .side-head button:hover { background: #2ea043; }
  .session-list { flex: 1; overflow-y: auto; padding: 6px; }
  .session-item { padding: 9px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; }
  .session-item:hover { background: var(--hover); }
  .session-item.active { background: var(--panel); border: 1px solid var(--border); }
  .session-item .t { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; margin-top: 2px; }
  .session-item .del { float: right; color: var(--muted); cursor: pointer; padding: 0 4px; }
  .session-item .del:hover { color: var(--red); }
  .empty { color: var(--muted); font-size: 12px; padding: 12px; }
  /* ---- main ---- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
  .topbar .title { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 3px; }
  .tabs button { background: none; border: none; color: var(--muted); padding: 5px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .tabs button.active { background: #238636; color: #fff; }
  .view { flex: 1; overflow: hidden; display: none; }
  .view.active { display: flex; flex-direction: column; }
  /* conversation */
  #chat { padding: 14px 18px; overflow-y: auto; flex: 1; }
  .msg { margin-bottom: 14px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 9px 13px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #238636; color: #fff; border-bottom-right-radius: 2px; }
  .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .input-bar { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .input-bar textarea { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--border);
                        border-radius: 8px; padding: 9px 12px; resize: none; font: inherit; height: 44px; }
  .input-bar button { background: #238636; border: 1px solid #2ea043; color: #fff; border-radius: 8px;
                      padding: 0 20px; cursor: pointer; font-weight: 600; }
  .input-bar button:disabled { opacity: .5; cursor: not-allowed; }
  /* trace */
  #trace { padding: 12px 16px; overflow-y: auto; flex: 1; }
  .step { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; background: var(--panel); }
  .step > summary { cursor: pointer; padding: 8px 10px; display: flex; align-items: center; gap: 8px; list-style: none; user-select: none; }
  .step > summary::-webkit-details-marker { display: none; }
  .step > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  .step[open] > summary::before { transform: rotate(90deg); }
  .step summary .desc { flex: 1; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); }
  .badge.running { color: var(--yellow); border-color: var(--yellow); }
  .badge.done { color: var(--green); border-color: var(--green); }
  .badge.failed, .badge.blocked { color: var(--red); border-color: var(--red); }
  .step .body { padding: 0 10px 10px; }
  .tool { border-top: 1px dashed var(--border); padding: 6px 0; font-family: var(--mono); font-size: 12px; }
  .tool .cmd { color: var(--accent); }
  .tool .err { color: var(--red); }
  .tool summary { cursor: pointer; list-style: none; color: var(--muted); }
  .tool summary::-webkit-details-marker { display: none; }
  .tool pre { margin: 6px 0 0; padding: 8px; background: #0d1117; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  .diff-old { color: var(--red); }
  .diff-new { color: var(--green); }
  .result { color: var(--muted); max-height: 220px; overflow-y: auto; }
  .turn { color: var(--muted); font-size: 11px; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 6px; }
  #approval { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
              background: var(--panel); border: 1px solid var(--yellow); border-radius: 10px;
              padding: 14px 18px; box-shadow: 0 8px 30px rgba(0,0,0,.5); max-width: 640px; z-index: 10; }
  #approval.hidden { display: none; }
  #approval .desc { margin-bottom: 10px; font-family: var(--mono); font-size: 12px; word-break: break-word; }
  #approval .actions { display: flex; gap: 8px; }
  .note { color: var(--muted); font-size: 12px; padding: 4px 10px; }
</style>
</head>
<body>
<aside>
  <div class="side-head">
    <h1>Coding Agent Workspace</h1>
    <select id="workspace-select" title="工作目录"></select>
    <div class="row">
      <button id="btn-new">+ 新建会话</button>
    </div>
  </div>
  <div class="session-list" id="session-list"><div class="empty">暂无会话</div></div>
</aside>

<main>
  <div class="topbar">
    <div class="title" id="top-title">选择一个会话，或新建会话开始</div>
    <div class="tabs">
      <button id="tab-chat" class="active" data-view="chat">对话</button>
      <button id="tab-trace" data-view="trace">轨迹</button>
    </div>
  </div>

  <div class="view active" id="view-chat">
    <div id="chat"><div class="empty">在下方输入任务，与 agent 对话。</div></div>
    <div class="input-bar">
      <textarea id="input" placeholder="输入任务，Enter 发送（Shift+Enter 换行）"></textarea>
      <button id="btn-send" disabled>发送</button>
    </div>
  </div>

  <div class="view" id="view-trace">
    <div id="trace"><div class="empty">运行后这里显示计划与工具轨迹。</div></div>
  </div>
</main>

<div id="approval" class="hidden">
  <div class="desc" id="approval-desc"></div>
  <div class="actions">
    <button id="btn-approve">允许一次</button>
    <button id="btn-always">始终允许</button>
    <button id="btn-reject" style="background:#da3633;border-color:#f85149">拒绝</button>
  </div>
</div>

<script>
(function () {
  var S = {
    workspaces: [],
    currentWorkspace: 'demo_workspace',
    sessions: [],
    sessionId: null,
    es: null,
    pendingApproval: null,
    streaming: false,
    steps: {}, roleStep: {}, currentStep: null,
    chatEl: null, traceEl: null
  };

  var chat = document.getElementById('chat');
  var trace = document.getElementById('trace');
  var sessionList = document.getElementById('session-list');
  var wsSelect = document.getElementById('workspace-select');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('btn-send');
  var topTitle = document.getElementById('top-title');

  function api(path, opts) {
    return fetch(path, opts).then(function (r) {
      if (!r.ok) return r.json().then(function (d) { throw new Error(d.detail || (r.status + ' ' + r.statusText)); });
      var ct = r.headers.get('content-type') || '';
      return ct.indexOf('json') >= 0 ? r.json() : r.text();
    });
  }

  // ---- sidebar ----
  function loadWorkspaces() {
    api('/api/workspaces').then(function (ws) {
      S.workspaces = ws;
      wsSelect.innerHTML = '';
      ws.forEach(function (w) {
        var o = document.createElement('option');
        o.value = w.path; o.textContent = w.name;
        wsSelect.appendChild(o);
      });
      wsSelect.value = S.currentWorkspace;
    }).catch(function (e) { console.error(e); });
  }

  function loadSessions() {
    api('/api/sessions').then(function (list) {
      S.sessions = list;
      renderSessions();
    });
  }

  function renderSessions() {
    var filtered = S.sessions.filter(function (s) {
      return !S.currentWorkspace || s.workspace === S.currentWorkspace;
    });
    if (!filtered.length) { sessionList.innerHTML = '<div class="empty">该目录下暂无会话</div>'; return; }
    sessionList.innerHTML = '';
    filtered.forEach(function (s) {
      var el = document.createElement('div');
      el.className = 'session-item' + (s.id === S.sessionId ? ' active' : '');
      el.innerHTML = '<span class="del" title="删除">×</span><div class="t"></div><div class="meta"></div>';
      el.querySelector('.t').textContent = s.title || '(新会话)';
      el.querySelector('.meta').textContent = (s.status || 'idle') + ' · ' + (s.message_count || 0) + ' 条消息';
      el.querySelector('.del').addEventListener('click', function (e) {
        e.stopPropagation();
        api('/api/sessions/' + s.id, { method: 'DELETE' }).then(loadSessions).catch(console.error);
      });
      el.addEventListener('click', function () { selectSession(s.id); });
      sessionList.appendChild(el);
    });
  }

  // ---- session ----
  function selectSession(id) {
    S.sessionId = id;
    S.steps = {}; S.roleStep = {}; S.currentStep = null; S.streaming = false;
    trace.innerHTML = '<div class="empty">加载轨迹…</div>';
    chat.innerHTML = '';
    renderSessions();
    api('/api/sessions/' + id).then(function (s) {
      topTitle.textContent = s.title || '(新会话)';
      wsSelect.value = s.workspace;
      S.currentWorkspace = s.workspace;
      renderMessages(s.messages || []);
      if (!s.messages || !s.messages.length) chat.innerHTML = '<div class="empty">在下方输入任务，与 agent 对话。</div>';
      sendBtn.disabled = false;
      openStream(id);
    }).catch(function (e) { topTitle.textContent = '错误：' + e.message; });
  }

  function newSession() {
    api('/api/sessions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ workspace: S.currentWorkspace })
    }).then(function (d) {
      loadSessions();
      selectSession(d.session_id);
    }).catch(function (e) { alert('创建会话失败：' + e.message); });
  }

  // ---- conversation ----
  function renderMessages(msgs) {
    chat.innerHTML = '';
    (msgs || []).forEach(function (m) { appendMessage(m.role, m.content, false); });
    scrollChat();
  }

  function appendMessage(role, content, streamable) {
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    var who = document.createElement('div');
    who.className = 'who';
    who.textContent = role === 'user' ? '你' : 'agent';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content || '';
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    scrollChat();
    if (streamable) return bubble;
    return null;
  }

  function scrollChat() { chat.scrollTop = chat.scrollHeight; }

  function sendMessage() {
    var text = input.value.trim();
    if (!text || !S.sessionId || S.streaming) return;
    input.value = '';
    appendMessage('user', text, false);
    var bubble = appendMessage('assistant', '', true);
    S.streaming = true;
    S.activeBubble = bubble;
    sendBtn.disabled = true;
    api('/api/sessions/' + S.sessionId + '/messages', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text })
    }).catch(function (e) {
      if (bubble) bubble.textContent = 'Error: ' + e.message;
      S.streaming = false; S.activeBubble = null; sendBtn.disabled = false;
    });
  }

  // ---- trace ----
  function roleOf(a) { return !a ? 'single' : (a.endsWith('_agent') ? a.slice(0, -6) : a); }
  function ensureStep(id, description, agent) {
    if (S.steps[id]) return S.steps[id];
    var d = document.createElement('details');
    d.className = 'step'; d.open = true;
    var s = document.createElement('summary');
    var b = document.createElement('span'); b.className = 'badge pending'; b.textContent = 'pending';
    var desc = document.createElement('span'); desc.className = 'desc';
    desc.textContent = (description || '') + (agent ? ' [' + agent + ']' : '');
    s.appendChild(b); s.appendChild(desc); d.appendChild(s);
    var body = document.createElement('div'); body.className = 'body'; d.appendChild(body);
    trace.appendChild(d);
    S.steps[id] = { el: d, body: body, badge: b };
    return S.steps[id];
  }
  function setBadge(id, text, cls) { var s = S.steps[id]; if (!s) return; s.badge.textContent = text; s.badge.className = 'badge ' + (cls || 'pending'); }
  function stepFor(ev) { return S.roleStep[roleOf(ev.agent_id)] || S.currentStep || '_single'; }
  function addTool(ev) {
    var sid = stepFor(ev);
    var step = ensureStep(sid, sid === '_single' ? 'single agent' : '步骤 ' + sid, '');
    var tcId = ev.payload.tool_call_id || Math.random().toString(36).slice(2);
    var wrap = document.createElement('details'); wrap.className = 'tool'; wrap.dataset.tcid = tcId;
    var sum = document.createElement('summary');
    sum.innerHTML = '&#9654; <span class="cmd">' + ev.payload.tool + '</span>';
    wrap.appendChild(sum);
    var inner = document.createElement('div'); wrap.appendChild(inner);
    step.body.appendChild(wrap); step.el.open = true;
    var args = ev.payload.arguments || {};
    if (ev.payload.tool === 'patch_file') inner.appendChild(diffBlock('path: ' + args.path, args.old_text, args.new_text));
    else if (ev.payload.tool === 'write_file') inner.appendChild(diffBlock('write: ' + args.path, null, args.content));
    else if (Object.keys(args).length) inner.appendChild(preBlock(JSON.stringify(args, null, 2)));
  }
  function diffBlock(label, oldT, newT) {
    var div = document.createElement('div');
    if (label) { var h = document.createElement('div'); h.className = 'note'; h.textContent = label; div.appendChild(h); }
    if (oldT != null) { var o = document.createElement('pre'); o.className = 'diff-old'; o.textContent = '- ' + oldT; div.appendChild(o); }
    if (newT != null) { var n = document.createElement('pre'); n.className = 'diff-new'; n.textContent = '+ ' + newT; div.appendChild(n); }
    return div;
  }
  function preBlock(t) { var p = document.createElement('pre'); p.textContent = t; return p; }
  function findTool(id) { return trace.querySelector('.tool[data-tcid="' + id + '"]'); }
  function turnMarker(text) { var d = document.createElement('div'); d.className = 'turn'; d.textContent = '▶ ' + text; trace.appendChild(d); }

  // ---- events ----
  function handle(ev) {
    var p = ev.payload || {};
    switch (ev.event_type) {
      case 'SESSION_START': turnMarker(p.task || ''); break;
      case 'PLAN_CREATED': S.steps = {}; (p.steps || []).forEach(function (s) { ensureStep(s.id, s.description, s.assigned_agent); setBadge(s.id, 'pending', 'pending'); }); break;
      case 'STEP_START': S.currentStep = p.step_id; ensureStep(p.step_id, p.description, p.assigned_agent); setBadge(p.step_id, 'running', 'running'); break;
      case 'SUBAGENT_START': S.roleStep[roleOf(ev.agent_id)] = p.step_id; break;
      case 'PRE_TOOL_USE': addTool(ev); break;
      case 'POST_TOOL_USE': { var w = findTool(p.tool_call_id); if (w) { var r = document.createElement('pre'); r.className = 'result'; r.textContent = p.content || ''; w.appendChild(r); } break; }
      case 'TOOL_ERROR': { var we = findTool(p.tool_call_id); if (we) { var e = document.createElement('pre'); e.className = 'err'; e.textContent = 'error: ' + (p.error || ''); we.appendChild(e); } break; }
      case 'STREAM_DELTA':
        if ((ev.agent_id === 'main_agent' || ev.agent_id === 'single_agent') && S.streaming && S.activeBubble) {
          S.activeBubble.textContent += (p.text || '');
          scrollChat();
        }
        break;
      case 'TURN_END':
        if (S.streaming && S.activeBubble) {
          if (!S.activeBubble.textContent.trim()) S.activeBubble.textContent = p.summary || '';
          S.streaming = false; S.activeBubble = null; sendBtn.disabled = false;
          loadSessions();
        }
        break;
      case 'APPROVAL_PENDING': showApproval(p); break;
      case 'APPROVAL_GRANTED': document.getElementById('approval').classList.add('hidden'); break;
      case 'APPROVAL_REJECTED': document.getElementById('approval').classList.add('hidden'); break;
      case 'SUBAGENT_FINISH': { var sid = S.roleStep[roleOf(ev.agent_id)] || S.currentStep; if (sid && p.status && p.status !== 'SUCCESS' && S.steps[sid]) setBadge(sid, p.status.toLowerCase(), 'failed'); break; }
    }
  }

  function openStream(id) {
    if (S.es) { S.es.close(); S.es = null; }
    S.es = new EventSource('/api/sessions/' + id + '/events');
    S.es.onmessage = function (e) { try { handle(JSON.parse(e.data)); } catch (err) {} };
  }

  // ---- approval ----
  function showApproval(p) {
    S.pendingApproval = p.approval_id;
    document.getElementById('approval-desc').textContent = '需要审批：' + p.description;
    document.getElementById('approval').classList.remove('hidden');
  }
  function sendApproval(approve, always) {
    if (!S.pendingApproval || !S.sessionId) return;
    api('/api/sessions/' + S.sessionId + '/approve/' + S.pendingApproval, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ approve: approve, always: always })
    }).catch(console.error);
    document.getElementById('approval').classList.add('hidden');
    S.pendingApproval = null;
  }

  // ---- wire ----
  document.getElementById('btn-new').addEventListener('click', newSession);
  document.getElementById('btn-send').addEventListener('click', sendMessage);
  wsSelect.addEventListener('change', function () { S.currentWorkspace = wsSelect.value; loadSessions(); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
      document.getElementById('view-' + b.dataset.view).classList.add('active');
    });
  });
  document.getElementById('btn-approve').addEventListener('click', function () { sendApproval(true, false); });
  document.getElementById('btn-always').addEventListener('click', function () { sendApproval(true, true); });
  document.getElementById('btn-reject').addEventListener('click', function () { sendApproval(false, false); });

  // init
  loadWorkspaces();
  loadSessions();
})();
</script>
</body>
</html>
