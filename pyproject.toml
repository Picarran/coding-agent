[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "1.0.0"
description = "A from-scratch coding agent (multi-agent + MCP + web workspace)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pyyaml>=6.0",
]

[project.scripts]
# `pcoding`            -> interactive CLI (workspace = current directory)
# `pcoding "task"`     -> one-shot run
# `pcoding web`        -> start the web workspace (http://127.0.0.1:8001)
pcoding = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*", "web*"]
